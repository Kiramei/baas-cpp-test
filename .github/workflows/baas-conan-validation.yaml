name: BAAS Conan validation

on:
  workflow_dispatch:
    inputs:
      baas_ref:
        description: BAAS_Cpp ref to validate
        required: false
        default: main
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  validate:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows BAAS App CUDA OFF
            runner: windows-latest
            platform: windows
            conan_cache_key: Conan2-BAAS-CUDA_off-Windows-x64
            conan_output: windows-msvc-release-baas
            host_profile: windows-msvc-release
            preset: conan-windows-msvc-release-baas
            extra_conan_args: |
              -o
              &:onnxruntime_use_cuda=False
            test_command: ""
            release_product: BAAS
            release_platform: windows
            release_arch: x64
            release_variant: ""
          - name: Windows BAAS App CUDA ON
            runner: windows-latest
            platform: windows-cuda
            conan_cache_key: Conan2-BAAS-CUDA_on-Windows-x64
            conan_output: windows-msvc-release-baas-cuda
            host_profile: windows-msvc-release
            preset: conan-windows-msvc-release-baas-cuda
            extra_conan_args: |
              -o
              &:onnxruntime_use_cuda=True
            test_command: ""
            release_product: BAAS
            release_platform: windows
            release_arch: x64
            release_variant: cuda
          - name: Windows OCR
            runner: windows-latest
            platform: windows
            conan_cache_key: Conan2-BAAS_ocr-Windows-x64
            conan_output: windows-msvc-release-ocr
            host_profile: windows-msvc-release
            preset: conan-windows-msvc-release-ocr
            extra_conan_args: |
              -o
              &:onnxruntime_use_cuda=False
              -o
              &:use_ffmpeg=False
              -o
              &:use_benchmark=False
            test_command: >-
              python -m unittest discover -s apps/ocr_server/test -p "*.py" &&
              python -c "import shutil; shutil.rmtree('build/bin/output', ignore_errors=True); shutil.rmtree('build/bin/config', ignore_errors=True)"
            release_product: BAAS_ocr
            release_platform: windows
            release_arch: x64
            release_variant: ""
          - name: Linux OCR
            runner: ubuntu-22.04
            platform: linux
            conan_cache_key: Conan2-BAAS_ocr-Linux-x64
            conan_output: linux-gcc-release-ocr
            host_profile: linux-gcc-release
            preset: conan-linux-gcc-release-ocr
            extra_conan_args: |
              -o
              &:onnxruntime_use_cuda=False
              -o
              &:use_ffmpeg=False
              -o
              &:use_benchmark=False
            test_command: >-
              python -m unittest discover -s apps/ocr_server/test -p "*.py" &&
              python -c "import shutil; shutil.rmtree('build/bin/output', ignore_errors=True); shutil.rmtree('build/bin/config', ignore_errors=True)"
            release_product: BAAS_ocr
            release_platform: linux
            release_arch: x64
            release_variant: ""
          - name: macOS OCR
            runner: macos-latest
            platform: macos
            conan_cache_key: Conan2-BAAS_ocr-macOS-arm64
            conan_output: macos-appleclang-release-ocr
            host_profile: macos-appleclang-release
            preset: conan-macos-appleclang-release-ocr
            extra_conan_args: |
              -o
              &:onnxruntime_use_cuda=False
              -o
              &:use_ffmpeg=False
              -o
              &:use_benchmark=False
            test_command: >-
              python -m unittest discover -s apps/ocr_server/test -p "*.py" &&
              python -c "import shutil; shutil.rmtree('build/bin/output', ignore_errors=True); shutil.rmtree('build/bin/config', ignore_errors=True)"
            release_product: BAAS_ocr
            release_platform: macos
            release_arch: arm64
            release_variant: ""
          - name: Android OCR arm64-v8a
            runner: windows-latest
            platform: android
            conan_cache_key: Conan2-BAAS_ocr-Android-arm64-v8a
            conan_output: android-clang-release-ocr-arm64-v8a
            host_profile: android-clang-arm64-v8a-release
            preset: conan-android-clang-release-ocr-arm64-v8a
            extra_conan_args: |
              -c:h
              tools.android:ndk_path=${ANDROID_NDK_LATEST_HOME}
              -o
              &:onnxruntime_use_cuda=False
              -o
              &:use_ffmpeg=False
              -o
              &:use_benchmark=False
            test_command: ""
            release_product: BAAS_ocr
            release_platform: android
            release_arch: arm64-v8a
            release_variant: ""
          - name: Android OCR x86_64
            runner: windows-latest
            platform: android
            conan_cache_key: Conan2-BAAS_ocr-Android-x86_64
            conan_output: android-clang-release-ocr-x86_64
            host_profile: android-clang-x86_64-release
            preset: conan-android-clang-release-ocr-x86_64
            extra_conan_args: |
              -c:h
              tools.android:ndk_path=${ANDROID_NDK_LATEST_HOME}
              -o
              &:onnxruntime_use_cuda=False
              -o
              &:use_ffmpeg=False
              -o
              &:use_benchmark=False
            test_command: ""
            release_product: BAAS_ocr
            release_platform: android
            release_arch: x86_64
            release_variant: ""

    steps:
      - name: Checkout validation harness
        uses: actions/checkout@v4
        with:
          path: harness

      - name: Checkout BAAS_Cpp
        uses: actions/checkout@v4
        with:
          repository: pur1fying/BAAS_Cpp
          ref: ${{ inputs.baas_ref }}
          fetch-depth: 1
          path: baas_cpp

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Ninja on Windows
        if: ${{ startsWith(matrix.platform, 'windows') || matrix.platform == 'android' }}
        shell: pwsh
        run: choco install ninja

      - name: Set up MSVC
        if: ${{ startsWith(matrix.platform, 'windows') || matrix.platform == 'android' }}
        uses: TheMrMilchmann/setup-msvc-dev@v3
        with:
          arch: x64

      - name: Set up CUDA Toolkit
        if: ${{ matrix.platform == 'windows-cuda' }}
        uses: Jimver/cuda-toolkit@v0.2.24
        with:
          cuda: "12.2.0"

      - name: Install Linux build tools
        if: ${{ matrix.platform == 'linux' }}
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build software-properties-common
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
          sudo apt-get update
          sudo apt-get install -y g++-13
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-13 100
          g++ --version

      - name: Prepare macOS tools
        if: ${{ matrix.platform == 'macos' }}
        shell: bash
        run: brew update

      - name: Check Android NDK
        if: ${{ matrix.platform == 'android' }}
        shell: bash
        run: |
          test -n "$ANDROID_NDK_LATEST_HOME"
          test -d "$ANDROID_NDK_LATEST_HOME"
          echo "ANDROID_NDK_LATEST_HOME=$ANDROID_NDK_LATEST_HOME"

      - name: Install OCR test dependencies
        if: ${{ matrix.test_command != '' }}
        shell: bash
        working-directory: baas_cpp
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/ocr_server/test/requirements.txt

      - name: Build with Conan
        uses: ./harness/.github/actions/baas-conan-build
        with:
          source-dir: baas_cpp
          conan-output: ${{ matrix.conan_output }}
          host-profile: ${{ matrix.host_profile }}
          preset: ${{ matrix.preset }}
          extra-conan-args: ${{ matrix.extra_conan_args }}
          conan-cache-key: ${{ matrix.conan_cache_key }}
          conan-home: ${{ github.workspace }}/.conan2
          save-cache: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/baas-cpp-validation-harness' }}
          test-command: ${{ matrix.test_command }}

      - name: Dry run release asset name
        if: ${{ matrix.release_product != '' }}
        shell: bash
        working-directory: baas_cpp
        run: |
          if [[ "${{ matrix.release_product }}" == "BAAS" ]]; then
            version_file="build/${{ matrix.preset }}/BAAS_APP_version.txt"
          else
            version_file="build/${{ matrix.preset }}/BAAS_OCR_version.txt"
          fi

          version="$(tr -d '\r\n' < "${version_file}")"
          variant_suffix=""
          if [[ -n "${{ matrix.release_variant }}" ]]; then
            variant_suffix="_${{ matrix.release_variant }}"
          fi
          asset_name="${{ matrix.release_product }}_v${version}_${{ matrix.release_platform }}_${{ matrix.release_arch }}${variant_suffix}.zip"
          echo "Release asset dry run: ${asset_name}"
          echo "Release asset dry run: `${asset_name}`" >> "$GITHUB_STEP_SUMMARY"
