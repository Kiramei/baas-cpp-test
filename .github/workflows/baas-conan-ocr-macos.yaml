name: BAAS Conan OCR macOS validation

on:
  workflow_dispatch:
    inputs:
      baas_ref:
        description: BAAS_Cpp ref to validate
        required: false
        default: main
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  ocr-macos:
    name: macOS OCR
    runs-on: macos-latest
    steps:
      - name: Checkout validation harness
        uses: actions/checkout@v4
        with:
          path: harness

      - name: Checkout BAAS_Cpp
        uses: actions/checkout@v4
        with:
          repository: pur1fying/BAAS_Cpp
          ref: ${{ inputs.baas_ref }}
          fetch-depth: 1
          path: baas_cpp

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Check source resource layout
        shell: bash
        run: python harness/.github/scripts/baas_resource_checks.py no-vendored --source-root baas_cpp

      - name: Prepare macOS tools
        shell: bash
        run: brew update

      - name: Install OCR test dependencies
        shell: bash
        working-directory: baas_cpp
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/ocr_server/test/requirements.txt

      - name: Build with Conan
        uses: ./harness/.github/actions/baas-conan-build
        with:
          source-dir: baas_cpp
          conan-output: macos-appleclang-release-ocr
          host-profile: macos-appleclang-release
          preset: conan-macos-appleclang-release-ocr
          extra-conan-args: |
            -o
            &:onnxruntime_use_cuda=False
            -o
            &:use_ffmpeg=False
            -o
            &:use_benchmark=False
          conan-cache-key: Conan2-BAAS_ocr-macOS-arm64
          conan-home: ${{ github.workspace }}/.conan2
          save-cache: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/baas-cpp-validation-harness' }}
          test-command: >-
            python -m unittest discover -s apps/ocr_server/test -p "*.py" &&
            python -c "import shutil; shutil.rmtree('build/bin/output', ignore_errors=True); shutil.rmtree('build/bin/config', ignore_errors=True)"

      - name: Check runtime resources
        shell: bash
        run: |
          python harness/.github/scripts/baas_resource_checks.py outputs \
            --root baas_cpp/build/conan-macos-appleclang-release-ocr/bin/resource \
            --path ocr_models/configs.txt

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ocr-macos-arm64
          path: baas_cpp/build/conan-macos-appleclang-release-ocr/bin
          if-no-files-found: ignore

      - name: Dry run release asset name
        shell: bash
        working-directory: baas_cpp
        env:
          RELEASE_PRODUCT: BAAS_ocr
          RELEASE_PLATFORM: macos
          RELEASE_ARCH: arm64
          RELEASE_VARIANT: ""
          PRESET: conan-macos-appleclang-release-ocr
        run: |
          if [[ "$RELEASE_PRODUCT" == "BAAS" ]]; then
            version_file="build/${PRESET}/BAAS_APP_version.txt"
          else
            version_file="build/${PRESET}/BAAS_OCR_version.txt"
          fi

          version="$(tr -d '\r\n' < "${version_file}")"
          variant_suffix=""
          if [[ -n "$RELEASE_VARIANT" ]]; then
            variant_suffix="_${RELEASE_VARIANT}"
          fi
          asset_name="${RELEASE_PRODUCT}_v${version}_${RELEASE_PLATFORM}_${RELEASE_ARCH}${variant_suffix}.zip"
          echo "Release asset dry run: ${asset_name}"
          echo "Release asset dry run: `${asset_name}`" >> "$GITHUB_STEP_SUMMARY"
