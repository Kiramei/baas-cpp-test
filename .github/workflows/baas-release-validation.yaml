name: BAAS release validation

on:
  workflow_dispatch:
    inputs:
      baas_ref:
        description: BAAS_Cpp ref to validate
        required: false
        default: main
        type: string
      publish_release:
        description: Print release trigger after all BAAS builds pass
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: write

jobs:
  build-baas:
    uses: ./.github/workflows/baas-conan-baas-windows.yaml
    with:
      baas_ref: ${{ inputs.baas_ref }}

  release-trigger:
    name: Print BAAS release trigger
    needs: build-baas
    if: ${{ inputs.publish_release }}
    runs-on: ubuntu-22.04
    steps:
      - name: Print trigger
        run: |
          echo "BAAS release workflow triggered"
          echo "baas_ref: ${{ inputs.baas_ref }}"
          echo "publish_release: ${{ inputs.publish_release }}"
