name: BAAS Conan build
description: Export BAAS private Conan recipes, install dependencies, configure, build, and optionally test.

inputs:
  source-dir:
    description: Directory containing the BAAS_Cpp checkout.
    required: false
    default: baas_cpp
  conan-output:
    description: Conan output directory under build/conan.
    required: true
  host-profile:
    description: Host profile filename under deploy/conan/profiles.
    required: true
  preset:
    description: CMake configure and build preset name.
    required: true
  extra-conan-args:
    description: Additional arguments passed to conan install, one argument per line.
    required: false
    default: ""
  conan-cache-key:
    description: GitHub Actions cache key for the Conan home.
    required: true
  conan-home:
    description: Conan home directory to restore and save.
    required: false
    default: ${{ github.workspace }}/.conan2
  resource-cache-key:
    description: GitHub Actions cache key for BAAS locked resource downloads.
    required: false
    default: ""
  resource-download-root:
    description: Directory used as BAAS_RESOURCE_DOWNLOAD_ROOT.
    required: false
    default: ${{ github.workspace }}/.baas-resource-downloads
  save-cache:
    description: Whether this run is allowed to replace the cache key when Conan packages changed.
    required: false
    default: "false"
  build:
    description: Whether to run cmake --build after configure.
    required: false
    default: "true"
  test-command:
    description: Optional command to run after the build from source-dir.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: BAAS prebuild
      uses: ./harness/.github/actions/baas-prebuild
      with:
        source-dir: ${{ inputs.source-dir }}
        conan-output: ${{ inputs.conan-output }}
        host-profile: ${{ inputs.host-profile }}
        extra-conan-args: ${{ inputs.extra-conan-args }}
        conan-cache-key: ${{ inputs.conan-cache-key }}
        conan-home: ${{ inputs.conan-home }}
        resource-cache-key: ${{ inputs.resource-cache-key }}
        resource-download-root: ${{ inputs.resource-download-root }}

    - name: Configure CMake
      shell: bash
      working-directory: ${{ inputs.source-dir }}
      env:
        CONAN_HOME: ${{ inputs.conan-home }}
      run: cmake --preset "${{ inputs.preset }}" -DBAAS_RESOURCE_DOWNLOAD_ROOT="${{ inputs.resource-download-root }}"

    - name: Build
      if: ${{ inputs.build == 'true' }}
      shell: bash
      working-directory: ${{ inputs.source-dir }}
      env:
        CONAN_HOME: ${{ inputs.conan-home }}
      run: cmake --build --preset "${{ inputs.preset }}"

    - name: Prepare test layout
      if: ${{ inputs.test-command != '' }}
      shell: bash
      working-directory: ${{ inputs.source-dir }}
      run: |
        preset_bin="build/${{ inputs.preset }}/bin"
        if [[ -d "$preset_bin" ]]; then
          mkdir -p build/bin
          cp -a "$preset_bin"/. build/bin/
        fi

    - name: Test
      if: ${{ inputs.test-command != '' }}
      shell: bash
      working-directory: ${{ inputs.source-dir }}
      env:
        BAAS_OCR_SERVER_DIR: build/bin
      run: ${{ inputs.test-command }}

    - name: BAAS postbuild
      uses: ./harness/.github/actions/baas-postbuild
      with:
        source-dir: ${{ inputs.source-dir }}
        conan-cache-key: ${{ inputs.conan-cache-key }}
        conan-home: ${{ inputs.conan-home }}
        resource-cache-key: ${{ inputs.resource-cache-key }}
        resource-download-root: ${{ inputs.resource-download-root }}
        save-cache: ${{ inputs.save-cache }}
